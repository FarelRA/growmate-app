name: Docker Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONVEX_SELF_HOSTED_URL: http://localhost:3210
  CONVEX_SELF_HOSTED_ADMIN_KEY: gm-convex-adm

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      convex:
        image: ghcr.io/get-convex/convex-backend:latest
        ports:
          - 3210:3210
        env:
          CONVEX_SELF_HOSTED_ADMIN_KEY: gm-convex-adm
          CONVEX_INSTANCE_NAME: growmate
          CONVEX_INSTANCE_SECRET: gm-convex-sec
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Convex types
        run: |
          echo "Waiting for Convex backend..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3210 > /dev/null 2>&1; then
              echo "Convex backend ready"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          npx convex deploy --yes

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck
        continue-on-error: true

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
