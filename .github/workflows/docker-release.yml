name: Docker Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Convex backend
        run: |
          docker run --rm -d --name convex-backend \
            -e INSTANCE_NAME=growmate \
                -e INSTANCE_SECRET=9019abf8cbe24bbdacf9cf2840a55bc4144e895d387856a6ca55423b30c506fa \
            -p 3210:3210 \
            ghcr.io/get-convex/convex-backend:latest

          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3210 > /dev/null 2>&1; then
              echo "Convex backend ready"
              break
            fi
            echo "Waiting for Convex backend... (attempt $i)"
            sleep 2
          done

      - name: Generate Convex types
        run: |
          ADMIN_KEY=$(docker exec convex-backend /convex/generate_admin_key.sh | tail -1)
          echo "admin key length: ${#ADMIN_KEY}"
          CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210 \
          CONVEX_SELF_HOSTED_ADMIN_KEY="$ADMIN_KEY" \
          npx convex deploy --yes

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: docker rm -f convex-backend 2>/dev/null || true

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
