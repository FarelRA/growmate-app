services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      # HTTPS listener
      - --entrypoints.websecure.address=:443
      # HTTP listener - redirect to HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt via ACME (TLS challenge kept)
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=admin@growmate.bond
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      # Opt-in routing: every router below sets traefik.enable=true explicitly
      - --providers.docker.exposedByDefault=false
      # Single-line access log (CLF) for per-router traffic visibility
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/data
    labels:
      - traefik.enable=true
      # Shared middlewares live here so they survive app-container restarts.
      # Device telemetry + image uploads: ~tens of req/s normal, 100 avg / 200 burst is generous.
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=100
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=200
      # www -> apex choice: dedicated www router + redirect middleware (keeps the
      # apex rule clean; www gets its own cert from the same TLS-challenge resolver).
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\.growmate\.bond/(.*)
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://growmate.bond/$${1}

  growmate:
    # Pinned by digest: :latest resolved via registry metadata 2026-10-06, no pull.
    # NOTE: upstream image is linux/arm64-only; re-pin deliberately on rebuilds.
    image: ghcr.io/farelra/growmate-app@sha256:34df02f9752af46786b76c29e7eea81e9c6427e810bc43c15c98ca3bdaac3765
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_RUSTFS_BASE_URL: ${NUXT_PUBLIC_RUSTFS_BASE_URL}
      NUXT_PUBLIC_RUSTFS_BUCKET_IMAGE: ${NUXT_PUBLIC_RUSTFS_BUCKET_IMAGE}
      NUXT_PUBLIC_CONVEX_URL: ${NUXT_PUBLIC_CONVEX_URL}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL}
      # In-cluster Convex API (server/utils/convex.ts prefers this over the public hairpin).
      CONVEX_INTERNAL_URL: http://convex:3210
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET_IMAGE: ${RUSTFS_BUCKET_IMAGE}
      DEVICE_API_KEY: ${DEVICE_API_KEY}
    depends_on:
      # convex stays service_started: convex-backend image contents are unverifiable
      # without pulling, so no in-container probe can be trusted (see convex service).
      convex:
        condition: service_started
      rustfs:
        condition: service_healthy
    # node:24-alpine ships busybox wget — no new deps.
    # `/` is the only unauthenticated cheap probe: every /api/* route needs a
    # device key or user auth, so there is no lighter endpoint to use.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.growmate.rule=Host(`growmate.bond`)
      - traefik.http.routers.growmate.entrypoints=websecure
      - traefik.http.routers.growmate.tls.certresolver=letsencrypt
      - traefik.http.services.growmate.loadbalancer.server.port=3000
      # Device fleet API: firmware posts to https://api.growmate.bond/v1/*
      # (APP_SENSOR_API_URL / APP_CAMERA_API_URL, no /api prefix) while docs
      # use the /api/v1/* canonical paths — Nuxt serves both (server/api +
      # server/routes aliases). No redirects: devices do not follow them.
      - traefik.http.routers.growmate-api.rule=Host(`api.growmate.bond`)
      - traefik.http.routers.growmate-api.entrypoints=websecure
      - traefik.http.routers.growmate-api.tls.certresolver=letsencrypt
      - traefik.http.routers.growmate-api.service=growmate
      - traefik.http.routers.growmate-api.middlewares=api-ratelimit
      # www -> apex redirect (middleware defined on traefik service)
      - traefik.http.routers.growmate-www.rule=Host(`www.growmate.bond`)
      - traefik.http.routers.growmate-www.entrypoints=websecure
      - traefik.http.routers.growmate-www.tls.certresolver=letsencrypt
      - traefik.http.routers.growmate-www.service=growmate
      - traefik.http.routers.growmate-www.middlewares=www-to-apex

  rustfs:
    # Pinned deliberately: 1.0.1 ships amd64+arm64, S3 API on :9000 and the
    # console on :9001. Re-pin deliberately on upgrades, never :latest.
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    # Positional data-dir arg per upstream docs; address/console/creds via env.
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - rustfs-data:/data
    # Verified against 1.0.1: the image ships sh + curl and
    # GET /health answers {"status":"ok","service":"rustfs-endpoint",...}.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.rustfs.rule=Host(`storage.growmate.bond`)
      - traefik.http.routers.rustfs.entrypoints=websecure
      - traefik.http.routers.rustfs.tls.certresolver=letsencrypt
      - traefik.http.routers.rustfs.middlewares=api-ratelimit
      - traefik.http.services.rustfs.loadbalancer.server.port=9000
      # Console (:9001) stays unrouted — reach it over an SSH tunnel when
      # bucket inspection is needed.

  convex:
    # Pinned by digest to the image `latest` resolved to on 2026-09-28.
    # Tags on ghcr are commit SHAs with no semver; re-pin deliberately.
    image: ghcr.io/get-convex/convex-backend@sha256:b756b06641d15a55b5ec0692897ce5ad3715ddccfd02e1e213621e9e764255c8
    restart: unless-stopped
    # No healthcheck (untestable): image is not cached locally and pulls are
    # out of scope, so no shell/probe binary (wget/curl/nc) can be confirmed
    # inside convex-backend. Adding an unconfirmed probe would risk a
    # permanently-unhealthy container; dependents use service_started (above).
    environment:
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN}
      # Auth issuer allowlist (convex/auth.config.ts reads CONVEX_SITE_URL,
      # falling back to SITE_URL then localhost). Must match the public site
      # origin or password-JWT verification fails closed in production.
      CONVEX_SITE_URL: ${CONVEX_SITE_URL}
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET}
      # Fail-closed device auth (convex/sensors.ts, convex/streams.ts read container env).
      DEVICE_API_KEY: ${DEVICE_API_KEY}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET_IMAGE: ${RUSTFS_BUCKET_IMAGE}
      # S3 signing region (convex/crons.ts defaults to us-east-1 when unset).
      S3_REGION: ${S3_REGION:-us-east-1}
      # AI assistant action (convex/openai.ts reads all three from container env).
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      # Seed/admin + @convex-dev/auth inputs (convex/seed.ts reads container env).
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWKS: ${JWKS}
    volumes:
      - convex-data:/convex/data
    labels:
      - traefik.enable=true

      # API router: /api/* and /instance_name → port 3210 (Cloud API)
      - traefik.http.routers.convex-api.rule=Host(`convex.growmate.bond`) && (PathPrefix(`/api/`) || PathPrefix(`/instance_name`))
      - traefik.http.routers.convex-api.entrypoints=websecure
      - traefik.http.routers.convex-api.tls.certresolver=letsencrypt
      - traefik.http.routers.convex-api.priority=10
      - traefik.http.routers.convex-api.service=convex-api
      - traefik.http.routers.convex-api.middlewares=api-ratelimit
      - traefik.http.services.convex-api.loadbalancer.server.port=3210

      # Default router: everything else → port 3211 (HTTP Actions / Site)
      - traefik.http.routers.convex.rule=Host(`convex.growmate.bond`)
      - traefik.http.routers.convex.entrypoints=websecure
      - traefik.http.routers.convex.tls.certresolver=letsencrypt
      - traefik.http.routers.convex.priority=0
      - traefik.http.routers.convex.service=convex-site
      - traefik.http.services.convex-site.loadbalancer.server.port=3211

volumes:
  rustfs-data:
  traefik-data:
  convex-data:
