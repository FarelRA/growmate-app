services:
  traefik:
    image: traefik:latest
    command:
      # HTTPS listener
      - --entrypoints.websecure.address=:443
      # HTTP listener - redirect to HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt via ACME
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=admin@growmate.bond
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/data

  growmate:
    image: ghcr.io/FarelRA/growmate-app:latest
    environment:
      NUXT_PUBLIC_MINIO_BASE_URL: ${NUXT_PUBLIC_MINIO_BASE_URL}
      NUXT_PUBLIC_MINIO_BUCKET_IMAGE: ${NUXT_PUBLIC_MINIO_BUCKET_IMAGE}
      NUXT_PUBLIC_CONVEX_URL: ${NUXT_PUBLIC_CONVEX_URL}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_IMAGE: ${MINIO_BUCKET_IMAGE}
      DEVICE_API_KEY: ${DEVICE_API_KEY}
    depends_on:
      convex:
        condition: service_started
      minio:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.growmate.rule=Host(`growmate.bond`)
      - traefik.http.routers.growmate.entrypoints=websecure
      - traefik.http.routers.growmate.tls.certresolver=letsencrypt
      - traefik.http.services.growmate.loadbalancer.server.port=3000

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`storage.growmate.bond`)
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls.certresolver=letsencrypt
      - traefik.http.services.minio.loadbalancer.server.port=9000

  convex:
    image: ghcr.io/get-convex/convex-backend:latest
    environment:
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN}
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_IMAGE: ${MINIO_BUCKET_IMAGE}
    volumes:
      - convex-data:/convex/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.convex.rule=Host(`convex.growmate.bond`)
      - traefik.http.routers.convex.entrypoints=websecure
      - traefik.http.routers.convex.tls.certresolver=letsencrypt
      - traefik.http.services.convex.loadbalancer.server.port=3210

volumes:
  minio-data:
  traefik-data:
  convex-data:
